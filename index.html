<text id="rH" x="224" y="498" text-anchor="middle" font-size="52" fill="#2FA8FF">--</text>

<text id="oH" x="549" y="498" text-anchor="middle" font-size="52" fill="#7FDBCA">--</text>

</svg>
<footer><a href="https://thingspeak.mathworks.com/channels/3535007">ThingSpeak channel 3535007</a><span>Outdoor: Open-Meteo</span></footer>
<script>
const C={hot:'#FF4040',cold:'#3D9BFF',white:'#FFFFFF',acc:'#2FA8FF',crack:'#FFB347',muted:'#8FA3C7',up:'#FF7A45',down:'#3D9BFF',level:'#9AA5B8',live:'#7CFC9A',sim:'#FFB347'};
const K={HOT:75,LO:68,HI:74,WET:60,DRY:40,DT:1,DRH:3,TREND:60};
const TS='https://api.thingspeak.com/channels/3535007/feeds.json?minutes=70&status=true';
const OM='https://api.open-meteo.com/v1/forecast?latitude=44.5956&longitude=-75.1691&current=temperature_2m,relative_humidity_2m&hourly=temperature_2m,relative_humidity_2m&past_hours=2&forecast_hours=1&temperature_unit=fahrenheit&timezone=America%2FNew_York';
const U=392,X=u=>400+u*U,Y=u=>400-u*U,R=u=>u*U,$=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e}
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:NaN};
const f1=(v,d)=>isNaN(v)?'--':v.toFixed(d);
function arrow(g,x,y,v,v0,thr){g.innerHTML='';if(isNaN(v)||isNaN(v0))return;const d=v-v0;
 let a=0,c=C.level;if(d>=thr){a=Math.PI/4;c=C.up}else if(d<=-thr){a=-Math.PI/4;c=C.down}
 const L=.06,ux=Math.cos(a),uy=Math.sin(a),h=.06,px=-uy,py=ux,x1=x+L*ux,y1=y+L*uy;
 el('line',{x1:X(x-L*ux),y1:Y(y-L*uy),x2:X(x1),y2:Y(y1),stroke:c,'stroke-width':5},g);
 const pts=[[x1+.6*h*ux,y1+.6*h*uy],[x1-h*ux+.6*h*px,y1-h*uy+.6*h*py],[x1-h*ux-.6*h*px,y1-h*uy-.6*h*py]];
 el('polygon',{points:pts.map(p=>X(p[0])+','+Y(p[1])).join(' '),fill:c},g)}
function face(t){const g=$('face');g.innerHTML='';if(isNaN(t))return;
 const c=t>K.HI?C.hot:t<K.LO?C.cold:C.white,x=-.885,y=.07,r=.07,sm=t>=K.LO&&t<=K.HI;
 el('circle',{cx:X(x),cy:Y(y),r:R(r),fill:'none',stroke:c,'stroke-width':3.5},g);
 for(const s of[-1,1])el('circle',{cx:X(x+s*.35*r),cy:Y(y+.3*r),r:R(.12*r),fill:c},g);
 const p=[];for(let i=0;i<=30;i++){const a=-.8*Math.PI+i/30*.6*Math.PI;p.push([x+.55*r*Math.cos(a),sm?y+.05*r+.55*r*Math.sin(a):y-.75*r-.55*r*Math.sin(a)])}
 el('polyline',{points:p.map(q=>X(q[0])+','+Y(q[1])).join(' '),fill:'none',stroke:c,'stroke-width':3.5,'stroke-linecap':'round'},g)}
function dropPath(x,y,r){let d=`M${X(x)},${Y(y+1.9*r)}`;for(let i=0;i<=40;i++){const a=-(-Math.PI/6+i/40*(4*Math.PI/3));d+=` L${X(x+r*Math.cos(a))},${Y(y+r*Math.sin(a))}`}return d+'Z'}
function drops(h){const g=$('drops');g.innerHTML='';if(isNaN(h))return;
 if(h>K.WET){el('path',{d:dropPath(-.80,-.30,.055),fill:C.acc},g);el('path',{d:dropPath(-.69,-.22,.045),fill:C.acc},g)}
 else if(h<K.DRY){const x=-.76,y=-.30,r=.065;el('path',{d:dropPath(x,y,r),fill:'none',stroke:C.crack,'stroke-width':3},g);
  el('polyline',{points:[[-.1,1.2],[.25,.5],[-.15,0],[.15,-.6]].map(q=>X(x+r*q[0])+','+Y(y+r*q[1])).join(' '),fill:'none',stroke:C.crack,'stroke-width':2.5},g)}
 else el('path',{d:dropPath(-.76,-.30,.05),fill:'none',stroke:C.muted,'stroke-opacity':.5,'stroke-width':3},g)}
function prev(rows,key,tLast){const ok=rows.filter(r=>!isNaN(r[key]));if(!ok.length)return[NaN,NaN];
 const last=ok[ok.length-1],target=last.t-K.TREND*6e4;let b=ok[0];for(const r of ok)if(Math.abs(r.t-target)<Math.abs(b.t-target))b=r;
 return[last[key],last.t-b.t<30*6e4?NaN:b[key],last.t]}
let S={tLast:NaN,rT:NaN,rH:NaN,oT:NaN,oH:NaN,sim:false};
const fmtNY=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'short',month:'short',day:'2-digit',hour:'numeric',minute:'2-digit',hour12:true});
function render(){const s=S;
 if(isNaN(s.tLast)){$('upd').textContent='Wi-Fi: NN118 display | no recent data';$('clock').textContent='--'}
 else{const m=Math.max(0,Math.round((Date.now()-s.tLast)/6e4));$('upd').textContent=m<1?'Updated just now':m<120?`Updated ${m} min ago`:`Updated ${(m/60).toFixed(1)} h ago`;
  const p=Object.fromEntries(fmtNY.formatToParts(new Date(s.tLast)).map(o=>[o.type,o.value]));
  $('clock').textContent=`${p.weekday} ${p.month} ${p.day}\u00a0\u00a0\u00a0${p.hour}:${p.minute} ${p.dayPeriod}`}
 $('rT').textContent=f1(s.rT,1)+'°F';$('rT').setAttribute('fill',!isNaN(s.rT)&&s.rT>K.HOT?C.hot:C.white);
 $('rH').textContent=f1(s.rH,0)+'%';$('oT').textContent=f1(s.oT,1)+'°F';$('oH').textContent=f1(s.oH,0)+'%';
 face(s.rT);drops(s.rH);
 arrow($('aRT'),-.13,.07,s.rT,s.rT60,K.DT);arrow($('aRH'),-.17,-.25,s.rH,s.rH60,K.DRH);
 arrow($('aOT'),.82,.07,s.oT,s.oT60,K.DT);arrow($('aOH'),.70,-.25,s.oH,s.oH60,K.DRH);
 const d=s.rT-s.oT;$('dl').textContent=isNaN(d)?'--°F vs outside':(d>=0?'+':'')+d.toFixed(1)+'°F vs outside';
 $('live').textContent=s.sim?'Simulated data':'Live data';$('live').setAttribute('fill',s.sim?C.sim:C.live)}
async function getRoom(){try{const j=await (await fetch(TS,{cache:'no-store'})).json();
  const rows=(j.feeds||[]).map(f=>{const c=num(f.field1);let F=num(f.field5);if(isNaN(F)&&!isNaN(c))F=c*9/5+32;return{t:Date.parse(f.created_at),F,H:num(f.field2),st:f.status}});
  const a=prev(rows,'F'),b=prev(rows,'H');Object.assign(S,{rT:a[0],rT60:a[1],rH:b[0],rH60:b[1],tLast:a[2]??b[2]??NaN});
  const lastE=rows[rows.length-1];S.sim=!!(lastE&&String(lastE.st||'').trim().toLowerCase()==='simulated')}
 catch(e){Object.assign(S,{rT:NaN,rH:NaN,rT60:NaN,rH60:NaN,tLast:NaN})}}
async function getOut(){try{const j=await (await fetch(OM,{cache:'no-store'})).json();
  const cn=Date.parse(j.current.time),tg=cn-K.TREND*6e4,ht=j.hourly.time.map(Date.parse);let k=0;ht.forEach((t,i)=>{if(Math.abs(t-tg)<Math.abs(ht[k]-tg))k=i});
  Object.assign(S,{oT:num(j.current.temperature_2m),oH:num(j.current.relative_humidity_2m),oT60:num(j.hourly.temperature_2m[k]),oH60:num(j.hourly.relative_humidity_2m[k])})}
 catch(e){Object.assign(S,{oT:NaN,oH:NaN,oT60:NaN,oH60:NaN})}}
async function tick(){await Promise.all([getRoom(),getOut()]);render()}
tick();setInterval(tick,30000);
</script></body></html>
